# ==========================================
# LMonitor Configuration
# ==========================================


[server]

tcp_port=9000

http_port=8081



[worker]

threads=4

queue_size=1024



[history]

max_size=120


# ==========================================
# Alert Configuration
# ==========================================

[alert]

# CPU warning threshold (%)

cpu_threshold=80


# Memory warning threshold (%)

memory_threshold=90



# ==========================================
# Agent Configuration
# ==========================================

[agent]

# Sampling interval (seconds)

sample_interval=1
