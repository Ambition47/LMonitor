# ==========================================
# LMonitor Configuration
# ==========================================


[server]

# TCP communication port
tcp_port=9000


# HTTP dashboard port
http_port=8080



[worker]

# Worker线程数量

threads=4


# Worker任务队列长度

queue_size=1024



[history]

# Maximum history records per host

max_size=120


# ==========================================
# Alert Configuration
# ==========================================

[alert]

# CPU warning threshold (%)

cpu_threshold=80


# Memory warning threshold (%)

memory_threshold=90



# ==========================================
# Agent Configuration
# ==========================================

[agent]

# Sampling interval (seconds)

sample_interval=1
